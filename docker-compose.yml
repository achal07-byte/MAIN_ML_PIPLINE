version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend